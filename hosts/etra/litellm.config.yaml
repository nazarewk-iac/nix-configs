# LiteLLM gateway config — GENERATED from data/llm.nix (brys member view).
# Regenerate with docs/tasks/2026-11/litellm-gateway/ (see definition.md).
#
# Every alias brys serves is exposed here as an OpenAI-compatible model whose
# upstream is brys' llama-swap, reached through the host socat egress relay
# (10.233.100.1:8443 -> brys netbird:39704). The relay keeps the container on its private
# network: it only ever talks to its host bridge address.

