# LiteLLM gateway config — GENERATED from data/llm.nix member views (brys + oams).
# Regenerate from the fleet data; do not hand-edit model_list.
#
# Each brys alias is a deployment on brys (BRYS_API_BASE = egress 8443 -> brys netbird:39704).
# The aliases oams also serves get a SECOND deployment on oams (OAMS_API_BASE =
# egress 8444 -> oams netbird:39704), so LiteLLM load-balances and fails over between
# the two hosts for those model groups.

