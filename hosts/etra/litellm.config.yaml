litellm_settings:
  # Prometheus metrics: the metric to alert on is litellm_deployment_state
  # (0 healthy / 1 partial / 2 outage).
  callbacks: [prometheus]
  drop_params: true

general_settings:
  # A database is deliberately NOT configured: no virtual keys, no budgets,
  # no spend logs. One shared master key. See research.md.
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  # The default request timeout is 6000 s; clamp it or a dead backend hangs a
  # request for over an hour. All-down returns 429 with retry-after.
  # 120 s, not the 6000 s default: a slow model (frontier) still gets a chance,
  # but a dead backend does not hang a client for over an hour. Raise per-model
  # in litellm_params for known-slow aliases if needed.
  timeout: 120
  num_retries: 1
  cooldown_time: 30
  allowed_fails: 2
