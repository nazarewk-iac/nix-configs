litellm_settings:
  callbacks: [prometheus]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  # 120 s (not the 6000 s default): a slow model gets a chance, a dead backend
  # does not hang a client for an hour. All-down returns 429 with retry-after.
  timeout: 120
  num_retries: 1
  cooldown_time: 30
  allowed_fails: 2
  # Round-robin across the deployments of a model group (brys + oams for the
  # shared aliases), and try the other host first on a retry.
  routing_strategy: simple-shuffle
  enable_weighted_failover: true
